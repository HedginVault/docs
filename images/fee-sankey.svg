<?xml version="1.0" encoding="UTF-8"?>
<svg id="fee-sankey-root" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fee-sankey-title fee-sankey-desc">
<title id="fee-sankey-title">Performance fee example</title>
<desc id="fee-sankey-desc">With a 20% performance fee and a 20% Hedgin share of that fee, users keep 80% of eligible profit, the manager receives 16%, and Hedgin receives 4%, before management fees.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
#fee-sankey-root { background:#0b0e10; font-family:Inter,system-ui,sans-serif; }
.name { fill:#e5e7eb; font-size:16px; font-weight:600; }
.detail { fill:#a4afbd; font-size:14px; }
.accent { fill:#38bdf8; }
</style></defs>
<rect width="480" height="360" fill="#0b0e10"/>
<path fill="#263344" data-source="profit" data-target="users" data-amount="80" d="M 72 16 H 340 V 176 H 72 Z"/>
<path fill="#38bdf8" fill-opacity=".42" data-source="profit" data-target="fee" data-amount="20" d="M 72 176 C 148 176 148 240 224 240 V 280 C 148 280 148 216 72 216 Z"/>
<path fill="#38bdf8" fill-opacity=".42" data-source="fee" data-target="manager" data-amount="16" d="M 232 240 H 340 V 272 H 232 Z"/>
<path fill="#38bdf8" data-source="fee" data-target="hedgin" data-amount="4" d="M 232 272 C 286 272 286 312 340 312 V 320 C 286 320 286 280 232 280 Z"/>
<rect fill="#b8c2ce" data-node="profit" data-amount="100" x="64" y="16" width="8" height="200" rx="2"/>
<rect fill="#83909f" data-node="users" data-amount="80" x="340" y="16" width="8" height="160" rx="2"/>
<rect fill="#278bb5" data-node="fee" data-amount="20" x="224" y="240" width="8" height="40" rx="2"/>
<rect fill="#278bb5" data-node="manager" data-amount="16" x="340" y="240" width="8" height="32" rx="2"/>
<rect fill="#38bdf8" data-node="hedgin" data-amount="4" x="340" y="312" width="8" height="8" rx="2"/>
<text class="name" x="52" y="112" text-anchor="end">Profit</text>
<text class="detail" x="52" y="132" text-anchor="end">100%</text>
<text class="name" x="360" y="88">Users</text>
<text class="detail" x="360" y="112">80%</text>
<text class="name" x="224" y="208">Manager fee</text>
<text class="detail" x="224" y="228">e.g. 20%</text>
<text class="name" x="360" y="252">Manager</text>
<text class="detail" x="360" y="276">16%</text>
<text class="name accent" x="360" y="316">Hedgin</text>
<text class="detail accent" x="360" y="340">4%</text>
</svg>
